# local 프로필 전용 설정 (DB 접속 정보, show-sql 등)
spring.application.name=study-room

spring.datasource.url=jdbc:postgresql://localhost:5432/study_room
spring.datasource.username=study_room
spring.datasource.password=local_password

# Whether to enable logging of SQL statements.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoint.health.show-details=always

# JWT (local only — use env/secrets in production)
jwt.secret=local-dev-jwt-secret-key-min-32-chars!!
jwt.access-token-settings.expiration=30m
jwt.refresh-token-settings.expiration=14d