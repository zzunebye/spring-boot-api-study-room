services:
  postgres:
    image: "postgres:17"
    # postgres docker conatiner를 처음 띄울 때 (초기화할 때) DB를 어떻게 만드는지 설정하는 환경변수
    # application-local.properties에 담긴 변수는 이를 사용해야한다.
    environment:
      - "POSTGRES_DB=study_room"
      - "POSTGRES_USER=study_room"
      - "POSTGRES_PASSWORD=local_password"
    ports:
      # 외부에서 5432번 포트로 접속하면 5432번 포트를 사용하는 postgres docker conatiner에 접속할 수 있도록 설정하는 것
      - "5432:5432"
    volumes:
      - study-room-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_room -d study_room"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  study-room-postgres:
